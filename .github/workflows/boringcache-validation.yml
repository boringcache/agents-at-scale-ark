name: Dashboard cache validation
run-name: ${{ inputs.connect && 'Dashboard OIDC connection' || format('Dashboard cache validation ({0})', inputs.phase || 'commit') }}

on:
  push:
    branches: [boringcache-validation]
  workflow_dispatch:
    inputs:
      connect:
        description: Approve this repository through BoringCache Connect CI
        type: boolean
        default: false
      phase:
        description: Cache phase; run warm only after the base build succeeds
        type: choice
        options: [warm, commit]
        default: warm
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease tag
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: dashboard-cache-validation
  cancel-in-progress: false

jobs:
  connect:
    name: Connect GitHub Actions to BoringCache
    if: inputs.connect && github.repository == 'boringcache/agents-at-scale-ark' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the released BoringCache CLI
        run: curl -fsSL https://install.boringcache.com/install.sh | sh
      - name: Connect repository with GitHub OIDC
        run: boringcache ci connect --oidc-provider github-actions

  dashboard:
    name: Dashboard (${{ matrix.provider }})
    if: ${{ !inputs.connect }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        provider: [boringcache, github]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record source and phase
        id: source
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          source_commit=$(cat .github/boringcache-source)
          git cat-file -e "$source_commit^{commit}"
          git diff --exit-code "$source_commit" -- services lib ark scripts Makefile helpers.mk version.txt
          phase=${REQUESTED_PHASE:-commit}
          if [ -z "$REQUESTED_PHASE" ] && [ "$source_commit" = cc08cdc658acb53632ceb0007a23c93ac276f967 ]; then
            phase=cold
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          mkdir -p validation-results
          # shellcheck disable=SC2016
          jq -n --arg source "$source_commit" --arg validation "$GITHUB_SHA" \
            --arg provider "$PROVIDER" --arg phase "$phase" \
            '{source_commit: $source, validation_commit: $validation, provider: $provider, phase: $phase}' \
            > validation-results/source.json
          # shellcheck disable=SC2016
          printf 'Source: `%s`\n\nProvider: %s\n\nPhase: %s\n' "$source_commit" "$PROVIDER" "$phase" >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Install Node for SDK generation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Prepare dashboard dependencies and generated API types
        run: make ark-dashboard-deps

      - name: Set up Docker Buildx
        if: matrix.provider == 'github'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build with BoringCache
        if: matrix.provider == 'boringcache'
        id: cache
        uses: boringcache/one@a610ec5a564efd9b360925056dbade04deb5def6 # v1.30.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: docker
          trust-policy: ${{ steps.source.outputs.phase == 'warm' && 'restore' || 'publish' }}
          fail-on-cache-error: true
          fail-on-cache-miss: ${{ steps.source.outputs.phase == 'warm' }}

      - name: Build with GitHub cache
        if: matrix.provider == 'github'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/ark-dashboard
          file: services/ark-dashboard/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ark-dashboard:validation
          cache-from: type=gha,scope=ark-dashboard-validation
          cache-to: ${{ steps.source.outputs.phase != 'warm' && 'type=gha,mode=min,scope=ark-dashboard-validation' || '' }}

      - name: Retain source and cache evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-results/
            ${{ steps.cache.outputs.evidence-path }}
          include-hidden-files: true
          retention-days: 30
